<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>夢の間 — Yume no Ma · A dream before the last one.</title>
<meta name="description" content="A narrative VR & desktop experience. You are the night caretaker of six children who are afraid to fall asleep. Coming to Steam, Q4 2027." />
<meta property="og:title" content="夢の間 — Yume no Ma" />
<meta property="og:description" content="A dream before the last one. A narrative VR experience. Coming to Steam, Q4 2027." />
<meta property="og:image" content="assets/og-image.png" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="夢の間 — Yume no Ma" />
<meta name="twitter:description" content="A dream before the last one." />
<meta name="twitter:image" content="assets/og-image.png" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="copy.jsx"></script>
<script type="text/babel" src="home.jsx"></script>
<script type="text/babel" src="characters.jsx"></script>
<script type="text/babel" src="press.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const App = () => {
  const [page, setPage] = useState('home');
  const [lang, setLang] = useState('en');
  const [introDone, setIntroDone] = useState(false);
  const t = COPY[lang];
  const p = PRESS_COPY[lang];

  useEffect(() => {
    const ti = setTimeout(() => setIntroDone(true), 4200);
    return () => clearTimeout(ti);
  }, []);

  useEffect(() => { window.scrollTo({top: 0, behavior: 'instant'}); }, [page]);
  useEffect(() => { window.scrollTo({top: 0, behavior: 'instant'}); }, [lang]);

  const navItems = [
    ['home', t.nav.home],
    ['characters', t.nav.characters],
  ];

  const goPress = () => setPage('press');

  return (
    <>
      <div className={`intro ${introDone ? 'gone' : ''}`} data-screen-label="00 Intro" aria-hidden={introDone}>
        <div className="intro-kanji">夢の間</div>
        <div className="intro-line">A dream before the last one.</div>
        <button className="intro-skip" onClick={() => setIntroDone(true)}>Enter ↓</button>
      </div>

      <nav className="nav">
        <div className="nav-mark" onClick={() => setPage('home')}>
          <span className="yume">夢の間</span>
          <span className="roman">Yume&nbsp;no&nbsp;Ma</span>
        </div>
        <div className="nav-links">
          {navItems.map(([id, label]) => (
            <button key={id} className={`nav-link ${page===id?'active':''}`} onClick={() => setPage(id)}>
              {label}
            </button>
          ))}
        </div>
        <div className="nav-side">
          <div className="lang-toggle">
            <button className={lang==='en'?'active':''} onClick={()=>setLang('en')}>EN</button>
            <button className={lang==='jp'?'active':''} onClick={()=>setLang('jp')}>JP</button>
            <button className={lang==='es'?'active':''} onClick={()=>setLang('es')}>ES</button>
          </div>
        </div>
      </nav>

      <div className={`page ${page==='home'?'active':''}`} data-screen-label="01 Home">
        {page === 'home' && <HomePage t={t} onPress={goPress} />}
      </div>
      <div className={`page ${page==='characters'?'active':''}`} data-screen-label="02 Children">
        {page === 'characters' && <CharactersPage t={t} onPress={goPress} />}
      </div>
      <div className={`page ${page==='press'?'active':''}`} data-screen-label="03 Press">
        {page === 'press' && <PressPage t={t} p={p} onHome={() => setPage('home')} />}
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
